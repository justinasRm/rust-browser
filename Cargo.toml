[package]
name = "robin"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "A tiny web browser engine you build from scratch in Rust, one commit at a time."
license = "MIT"
repository = "https://github.com/addyosmani/rust-browser"
readme = "README.md"
keywords = ["browser", "engine", "html", "css", "tutorial"]
categories = ["web-programming", "rendering"]

# The engine is split into a library (`robin`) plus a thin CLI (`src/main.rs`).
# Keeping the logic in the library is what makes the project easy to test and
# easy for a coding agent to navigate.
[lib]
name = "robin"
path = "src/lib.rs"

[[bin]]
name = "robin"
path = "src/main.rs"

# Dependencies are intentionally added *commit by commit*, exactly when the
# tutorial first needs them. The DOM, HTML, CSS, style and layout stages use
# nothing but the standard library. Painting, text, networking and the
# interactive window each pull in one focused crate.
[dependencies]
# Painting: encode the rendered pixel buffer as a PNG. We only need the PNG
# codec, so we switch off image's many default formats.
image = { version = "0.25", default-features = false, features = ["png"] }
# Text: rasterize TrueType glyphs to anti-aliased coverage bitmaps. Pure Rust,
# no system font dependencies - the fonts themselves are bundled in assets/.
fontdue = "0.9"
# Networking: a small blocking HTTP/HTTPS client (rustls TLS, gzip) for fetching
# live pages, plus URL parsing to resolve relative links like <link href>.
ureq = { version = "2", features = ["tls", "gzip"] }
url = "2"
# Interactive window: open a real OS window and push our pixel buffer to it, with
# keyboard/scroll input. A thin cross-platform framebuffer - no GUI toolkit.
minifb = "0.27"

# Used only by `examples/make_gif.rs` to encode the demo animation.
[dev-dependencies]
gif = "0.13"

[profile.release]
opt-level = 3
lto = "thin"
